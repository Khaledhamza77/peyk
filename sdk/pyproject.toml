[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peyk"
version = "0.1.0"
description = "Configure, orchestrate, and run the peyk document-parsing pipeline's Docker containers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See repository LICENSE" }
dependencies = [
    "docker>=7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
